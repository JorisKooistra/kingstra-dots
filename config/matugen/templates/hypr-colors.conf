# =============================================================================
# hypr-colors.conf — Matugen template voor Hyprland kleuren
# Gegenereerd door: matugen image <wallpaper>
# Accent 1 = focus, accent 2 = activiteit, accent 3 = attentie.
# =============================================================================

$primary                   = rgba({{colors.primary.default.hex_stripped}}ee)
$on_primary                = rgba({{colors.on_primary.default.hex_stripped}}ee)
$primary_container         = rgba({{colors.primary_container.default.hex_stripped}}ee)
$on_primary_container      = rgba({{colors.on_primary_container.default.hex_stripped}}ee)
$secondary                 = rgba({{colors.secondary.default.hex_stripped}}ee)
$on_secondary              = rgba({{colors.on_secondary.default.hex_stripped}}ee)
$secondary_container       = rgba({{colors.secondary_container.default.hex_stripped}}ee)
$tertiary                  = rgba({{colors.tertiary.default.hex_stripped}}ee)
$tertiary_container        = rgba({{colors.tertiary_container.default.hex_stripped}}ee)
$accent2_source            = rgba({{colors.secondary_accent_source.default.hex_stripped}}ee)
$accent2                   = rgba({{colors.secondary_accent.default.hex_stripped}}ee)
$accent2_container         = rgba({{colors.secondary_accent_container.default.hex_stripped}}ee)
$accent3_source            = rgba({{colors.tertiary_accent_source.default.hex_stripped}}ee)
$accent3                   = rgba({{colors.tertiary_accent.default.hex_stripped}}ee)
$accent3_container         = rgba({{colors.tertiary_accent_container.default.hex_stripped}}ee)
$error                     = rgba({{colors.error.default.hex_stripped}}ee)
$error_container           = rgba({{colors.error_container.default.hex_stripped}}ee)
$surface                   = rgba({{colors.surface.default.hex_stripped}}ee)
$on_surface                = rgba({{colors.on_surface.default.hex_stripped}}ee)
$surface_variant           = rgba({{colors.surface_variant.default.hex_stripped}}ee)
$surface_container         = rgba({{colors.surface_container.default.hex_stripped}}ee)
$surface_container_high    = rgba({{colors.surface_container_high.default.hex_stripped}}ee)
$surface_container_highest = rgba({{colors.surface_container_highest.default.hex_stripped}}ee)
$background                = rgba({{colors.background.default.hex_stripped}}ff)
$outline                   = rgba({{colors.outline.default.hex_stripped}}ee)
$outline_variant           = rgba({{colors.outline_variant.default.hex_stripped}}ee)
$inverse_surface           = rgba({{colors.inverse_surface.default.hex_stripped}}ee)
$inverse_primary           = rgba({{colors.inverse_primary.default.hex_stripped}}ee)

$focus_color     = $primary
$activity_color  = $accent2
$attention_color = $accent3
$border_active   = $primary $accent2 $accent3 55deg
$border_inactive = rgba({{colors.outline.default.hex_stripped}}44)
$shadow_color    = rgba({{colors.shadow.default.hex_stripped}}cc)

# =============================================================================
# 86-binds-passthrough.conf — Passthrough-submap (Citrix, VM's, remote desktops)
# =============================================================================
# In de passthrough-submap vangt Hyprland géén Super-shortcuts meer af: alle
# toetsen gaan rechtstreeks naar het gefocuste venster. Dit voorkomt dat de
# Citrix-client (wfica) crasht op de Super-toets en maakt Windows-shortcuts
# in de remote sessie bruikbaar.
#
# - Handmatig aan/uit: Super + Escape
# - Automatisch: citrix-guard.sh schakelt de submap in/uit zodra een
#   Citrix-venster focus krijgt of verliest.
# $mainMod is gedefinieerd in 80-binds-core.conf

bind = $mainMod, Escape, submap, passthrough   # Passthrough aan (alle binds uit)

submap = passthrough
bind = $mainMod, Escape, submap, reset   # Passthrough uit (enige actieve bind)
submap = reset

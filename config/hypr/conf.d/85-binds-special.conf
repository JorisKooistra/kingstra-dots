# =============================================================================
# 85-binds-special.conf — Speciale werkruimtes (scratchpads)
# =============================================================================
# $mainMod en $scripts zijn gedefinieerd in 80-binds-core.conf

# ---------------------------------------------------------------------------
# Spotify — special:spotify
# ---------------------------------------------------------------------------
bind = $mainMod,       S, togglespecialworkspace, spotify   # Spotify wisselen
bind = $mainMod SHIFT, S, movetoworkspacesilent, special:spotify   # Venster naar Spotify-scratchpad

# ---------------------------------------------------------------------------
# Discord / Vesktop — special:discord
# ---------------------------------------------------------------------------
bind = $mainMod,       D, togglespecialworkspace, discord   # Discord wisselen
bind = $mainMod SHIFT, D, movetoworkspacesilent, special:discord   # Venster naar Discord-scratchpad

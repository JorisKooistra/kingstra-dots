# =============================================================================
# 85-binds-special.conf — Speciale werkruimtes (scratchpads)
# =============================================================================
# $mainMod en $scripts zijn gedefinieerd in 80-binds-core.conf

# ---------------------------------------------------------------------------
# Spotify — special:spotify
# ---------------------------------------------------------------------------
bind = $mainMod ALT,       S, togglespecialworkspace, spotify   # Spotify wisselen
bind = $mainMod SHIFT ALT, S, movetoworkspacesilent, special:spotify   # Venster naar Spotify-scratchpad

# ---------------------------------------------------------------------------
# Discord / Vesktop — special:discord
# ---------------------------------------------------------------------------
bind = $mainMod ALT,       D, togglespecialworkspace, discord   # Discord wisselen
bind = $mainMod SHIFT ALT, D, movetoworkspacesilent, special:discord   # Venster naar Discord-scratchpad

# ---------------------------------------------------------------------------
# Generiek scratchpad — special:magic  (zie ook 80-binds-core.conf)
# ---------------------------------------------------------------------------
# SUPER + S   → toggle magic  (gedefinieerd in 80-binds-core.conf)
# SUPER + SHIFT + S → naar magic (gedefinieerd in 80-binds-core.conf)

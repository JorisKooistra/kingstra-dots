# =============================================================================
# 82-binds-widgets.conf — UI-widgets (Quickshell)
# =============================================================================
# Quickshell IPC-commando's worden toegevoegd zodra fase 5 klaar is.
# $mainMod is gedefinieerd in 80-binds-core.conf

# ---------------------------------------------------------------------------
# Quickshell — notificaties
# ---------------------------------------------------------------------------
bind = $mainMod,       N,    exec, ~/.config/quickshell/notifications/notification_control.sh toggle  # Meldingencentrum wisselen
bind = $mainMod SHIFT, N,    exec, ~/.config/quickshell/notifications/notification_control.sh clear   # Alle meldingen sluiten
bind = $mainMod ALT,   N,    exec, ~/.config/quickshell/notifications/notification_control.sh dnd     # Niet-storen wisselen

# ---------------------------------------------------------------------------
# Quickshell — topbar popups via qs_manager.sh (file-based IPC)
# ---------------------------------------------------------------------------
bind = $mainMod SHIFT, M,  exec, $scripts/qs_manager.sh toggle music       # Muziek popup
bind = $mainMod CTRL, C,   exec, $scripts/qs_manager.sh toggle calendar    # Kalender popup
bind = $mainMod, O,        exec, $scripts/qs_manager.sh toggle monitors    # Monitor overzicht
bind = $mainMod, X,        exec, $scripts/qs_manager.sh toggle focustime   # FocusTime
bind = $mainMod CTRL,  I,  exec, $scripts/qs_manager.sh toggle settings     # Settings panel
bind = $mainMod CTRL, T,   exec, $scripts/qs_manager.sh toggle theme        # Thema kiezen
bind = $mainMod CTRL, M,   exec, $scripts/qs_manager.sh toggle mode         # Mode kiezen
bind = $mainMod CTRL, G,   exec, quickshell-game                                  # Game launcher
bind = $mainMod, F1,       exec, $scripts/qs_manager.sh toggle help         # Sneltoetsen-overzicht

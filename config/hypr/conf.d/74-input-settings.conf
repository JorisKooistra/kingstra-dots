# =============================================================================
# 74-input-settings.conf — Input overrides
# =============================================================================
# Aangepast via de Settings-popup.
# =============================================================================

input {
    kb_layout = us
    # Leeg = de standaardvariant van de layout; dode toetsen komen hiervandaan.
    kb_variant = intl
    kb_options =

    touchpad {
        # false = button areas (Windows-achtig), true = clickfinger gedrag
        clickfinger_behavior = false
    }
}

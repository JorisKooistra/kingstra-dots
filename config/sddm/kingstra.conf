# =============================================================================
# /etc/sddm.conf.d/zz-kingstra.conf — SDDM configuratie
# Wordt geplaatst door fase 10 installer (vereist sudo).
# =============================================================================

[General]
# Gebruik dezelfde X11-greeter als de bestaande installatie; Xsetup ordent de displays.
DisplayServer=x11
# Numlock standaard aan
Numlock=on

[Theme]
# Kingstra eigen theme (zelfde stijl als vergrendelscherm)
Current=kingstra

[X11]
DisplayCommand=/usr/local/libexec/kingstra-sddm-xsetup

[Wayland]
# Hyprland-sessie als standaard
SessionDir=/usr/share/wayland-sessions
CompositorCommand=Hyprland

[Autologin]
# Geen autologin: altijd wachtwoord vragen bij opstarten.
# Overschrijft autologin uit eerder ingelezen conf.d-bestanden.
User=
Session=

[Users]
DefaultPath=/usr/local/sbin:/usr/local/bin:/usr/bin
HideShells=/sbin/nologin,/bin/false
MinimumUid=1000
MaximumUid=60513
RememberLastUser=true
RememberLastSession=true

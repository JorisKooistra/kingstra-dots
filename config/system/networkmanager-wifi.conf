# =============================================================================
# 99-kingstra-wifi.conf — NetworkManager WiFi-stabiliteit
# =============================================================================
# Geïnstalleerd door kingstra-dots (fase 12) naar /etc/NetworkManager/conf.d/.
#
# wifi.powersave = 2 schakelt 802.11 power saving uit. Power saving is op veel
# laptop-chipsets (Intel iwlwifi, Realtek rtw88/89) de hoofdoorzaak van
# haperende of wegvallende WiFi-verbindingen.
# =============================================================================

[connection]
wifi.powersave = 2

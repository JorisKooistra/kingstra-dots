# =============================================================================
# 99-kingstra-wireless.conf — Kernelmodule-opties voor WiFi/Bluetooth-stabiliteit
# =============================================================================
# Geïnstalleerd door kingstra-dots (fase 12) naar /etc/modprobe.d/.
# Opties voor niet-aanwezige modules zijn onschadelijk; dit bestand dekt de
# gangbare laptop-chipsets af. Wijzigingen vereisen een reboot (of module
# herladen) om actief te worden.
# =============================================================================

# Intel WiFi — power saving uit (voorkomt latency-spikes en drops)
options iwlwifi power_save=0
options iwlmvm power_scheme=1

# Realtek WiFi — deep link power saving uit (bekende oorzaak van drops)
options rtw88_core disable_lps_deep=y

# Bluetooth over USB — autosuspend uit (voorkomt haperende audio en
# adapters die na idle/suspend niet meer wakker worden)
options btusb enable_autosuspend=0

// /etc/logid.cfg — logiops (logid) voor Logitech HID++-muizen
//
// De duimknop van de M720 Triathlon is geen gewone muisknop: standaard stuurt
// hij de toetscombinatie Ctrl+Alt+Tab. Hyprland kan daar geen sleep-bind
// (bindm) op zetten. logid onderschept de knop (CID 0xd0) en laat hem in
// plaats daarvan BTN_TASK sturen, in Hyprland bekend als mouse:279.
//
// Controleren:  sudo logid -v           (devicenaam moet exact overeenkomen)
//               sudo libinput debug-events   (duimknop → BTN_TASK (279))
// Na wijzigen:  sudo systemctl restart logid
devices: (
{
    name: "M720 Triathlon Multi-Device Mouse";
    buttons: (
        {
            cid: 0xd0;
            action = {
                type: "Keypress";
                keys: ["BTN_TASK"];
            };
        }
    );
}
);

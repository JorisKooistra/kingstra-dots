# /etc/systemd/system/logid.service.d/kingstra.conf — geplaatst door kingstra-dots
# logid raakt de M720 kwijt als de muis na boot, slaap of een Bluetooth-herstel
# opnieuw verbindt. Altijd herstarten en nooit opgeven door de startlimiet,
# want de udev-regel en de slaap-hook herstarten logid bewust vaker.
[Unit]
After=bluetooth.service
StartLimitIntervalSec=0

[Service]
Restart=always
RestartSec=2

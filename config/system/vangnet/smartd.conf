# Kingstra: alle schijven bewaken. Korte test elke nacht om 02:00, lange op
# zaterdag om 03:00. Bij een probleem schrijft smartd-notify een regel die
# kingstra-health als melding toont. Slapende HDD's worden niet gewekt.
DEVICESCAN -a -o on -S on -n standby,q -s (S/../.././02|L/../../6/03) -W 4,45,55 -m root -M exec /usr/local/lib/kingstra/smartd-notify

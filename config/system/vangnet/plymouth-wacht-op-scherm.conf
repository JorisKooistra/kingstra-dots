# Kingstra: afsluitbeeld pas starten als Hyprland en X het scherm hebben losgelaten.
# Zonder dit begint Plymouth terwijl Hyprland nog afsluit en het scherm (DRM-master)
# vasthoudt; dan krijgt Plymouth geen beeld en zie je het afsluitscherm soms niet.
# Hooguit 6 seconden wachten; mislukt het, dan gaat het afsluiten gewoon door.
[Service]
ExecStartPre=-/usr/bin/timeout 6 /bin/sh -c 'while /usr/bin/pgrep -x "Hyprland|Xorg" >/dev/null; do sleep 0.1; done'

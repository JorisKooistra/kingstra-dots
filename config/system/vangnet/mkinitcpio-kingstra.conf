# Kingstra: initramfs van de gewone kernel (linux) met NVIDIA en Plymouth,
# zodat het opstartbeeld vroeg en op alle schermen verschijnt.
# Alleen gebruikt door /etc/mkinitcpio.d/linux.preset (default_config).
# linux-lts en de fallback-images gebruiken gewoon /etc/mkinitcpio.conf en
# blijven zo een terugval. Weghalen: sudo kingstra-opstart-nvidia --undo
source /etc/mkinitcpio.conf

# Het vraagteken maakt een module optioneel: zonder NVIDIA-driver geen fout.
MODULES+=(nvidia? nvidia_modeset? nvidia_uvm? nvidia_drm?)

# plymouth direct na systemd (of udev) in de bestaande HOOKS.
_kingstra_hooks=()
for _kingstra_hook in "${HOOKS[@]}"; do
    [[ $_kingstra_hook == plymouth ]] && continue
    _kingstra_hooks+=("$_kingstra_hook")
    [[ $_kingstra_hook == systemd || $_kingstra_hook == udev ]] && _kingstra_hooks+=(plymouth)
done
HOOKS=("${_kingstra_hooks[@]}")
unset _kingstra_hooks _kingstra_hook

[meta]
name = "Neon"
description = "Futuristische cockpit - zwart glas, scanlijnen, cyan/magenta neon"
icon = "󰙷"
preview_image = "neon.jpg"

[matugen]
scheme_type = "scheme-rainbow"
color_index = 1
contrast = 0.82
mode = "dark"

[appearance]
border_radius = 5
border_width = 2
gaps_in = 6
gaps_out = 10
bar_opacity = 0.99
popup_opacity = 0.98
blur_size = 5
blur_passes = 1
animation_speed = 1.34

[fonts]
ui_font = "Share Tech Mono"
ui_font_size = 12
mono_font = "JetBrainsMono Nerd Font"
mono_font_size = 12
display_font = "Share Tech Mono"
font_weight = "bold"
letter_spacing = 0.25

[icons]
icon_theme = "Papirus-Dark"

[quickshell]
bar_height = 34
bar_position = "top"
bar_rail_enabled = true
bar_rail_edge = "left"
bar_rail_width = 48
bar_status_strip_enabled = true
bar_status_strip_edge = "top"
bar_status_strip_height = 34

[color_transform]
hue_shift = 0
saturation_adjust = 0.42
lightness_adjust = -0.16
thematic_mix = 0.01

[material]
texture = "scanline"
overlay_opacity = 0.08
glow_intensity = 0.42

[terminal]
bg_opacity = 0.94
blur = false
padding = 10
cursor_style = "block"

[bar]
shape = "beveled"
template = "horizontal"
width_mode = "full"
floating = false
attach_to_screen_edge = true
top_edge_style = "beveled"
bottom_edge_style = "hard"
clock_style = "digital"
topbar_loose_blocks = false

[widgets]
shape = "segmented"
surface = "hard-tech"

[style_profile]
family = "neon"
density = "compact"
surface_mode = "hard-surface"
motion = "snappy"
panel_shadow = 0.42
outline_strength = 0.58
glass_strength = 0.02
widget_radius = 5
panel_padding = 9

[effects]
particles = "space-specks"
particle_count = 12
particle_speed = 0.26
ambient_effect = "neon-grid"
effect_intensity = 1.0
effect_cycle_ms = 3600
hover_reactivity = 1.0

[bar_dynamics]
drawer_style = "rail-panel"
module_density = "minimal"
workspace_preview = "numbers"
rail_accent = "segmented"

[terminal_visual]
overlay_asset = ""
overlay_opacity = 0.0

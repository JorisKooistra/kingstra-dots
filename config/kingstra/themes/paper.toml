[meta]
name = "Paper"
description = "Warme e-reader - licht, mat papier, bijna geen beweging"
icon = "󰈙"
preview_image = "paper.jpg"

[matugen]
scheme_type = "scheme-fidelity"
color_index = 0
contrast = 0.34
mode = "light"

[appearance]
border_radius = 10
border_width = 1
gaps_in = 14
gaps_out = 22
bar_opacity = 0.96
popup_opacity = 0.99
blur_size = 0
blur_passes = 0
animation_speed = 0.68

[fonts]
ui_font = "IBM Plex Sans"
ui_font_size = 13
mono_font = "IBM Plex Mono"
mono_font_size = 12
display_font = "IBM Plex Serif"
font_weight = "regular"
letter_spacing = 0

[icons]
icon_theme = "Papirus"

[quickshell]
bar_height = 40
bar_position = "top"
bar_rail_enabled = false
bar_rail_edge = "left"
bar_rail_width = 52
bar_status_strip_enabled = true
bar_status_strip_edge = "top"
bar_status_strip_height = 40

[color_transform]
hue_shift = 6
saturation_adjust = -0.18
lightness_adjust = 0.02
thematic_mix = 0.18

[material]
texture = "paper-fiber"
overlay_opacity = 0.08
glow_intensity = 0.0

[terminal]
bg_opacity = 0.96
blur = false
padding = 14
cursor_style = "beam"

[bar]
shape = "rounded"
template = "horizontal"
width_mode = "full"
floating = false
attach_to_screen_edge = true
top_edge_style = "flush"
bottom_edge_style = "soft"
clock_style = "digital"
topbar_loose_blocks = false

[widgets]
shape = "rounded"
surface = "paper-glass"

[style_profile]
family = "paper"
density = "comfortable"
surface_mode = "paper-glass"
motion = "calm"
panel_shadow = 0.04
outline_strength = 0.18
glass_strength = 0.0
widget_radius = 10
panel_padding = 16

[effects]
particles = "none"
particle_count = 0
particle_speed = 0.0
ambient_effect = "none"
effect_intensity = 0.0
effect_cycle_ms = 0
hover_reactivity = 0.18

[bar_dynamics]
drawer_style = "context-card"
module_density = "balanced"
workspace_preview = "hybrid"
rail_accent = "edge-line"

[terminal_visual]
overlay_asset = ""
overlay_opacity = 0.0

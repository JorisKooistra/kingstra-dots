[meta]
name = "Animated"
description = "Levendig — helder, speels, beheerst in beweging"
icon = "󰬀"
preview_image = "animated.jpg"

[matugen]
scheme_type = "scheme-fruit-salad"
color_index = 0
contrast = 0.2
mode = "dark"

[appearance]
border_radius = 16
border_width = 1
gaps_in = 10
gaps_out = 18
bar_opacity = 0.76
popup_opacity = 0.88
blur_size = 16
blur_passes = 3
animation_speed = 1.15

[fonts]
ui_font = "Nunito"
ui_font_size = 13
mono_font = "JetBrainsMono Nerd Font"
mono_font_size = 12
display_font = "Nunito"
font_weight = "regular"
letter_spacing = 0.05

[icons]
icon_theme = "Papirus"

[quickshell]
bar_height = 40
bar_position = "left"

[color_transform]
hue_shift = 12
saturation_adjust = 0.22
lightness_adjust = 0.02
thematic_mix = 0.14

[material]
texture = "motion"
overlay_opacity = 0.05
glow_intensity = 0.18

[terminal]
bg_opacity = 0.82
blur = true
padding = 14
cursor_style = "beam"

[bar]
shape = "kinetic-dock"
template = "compact-sidebar"
width_mode = "floating"
floating = true
attach_to_screen_edge = false
top_edge_style = "soft"
bottom_edge_style = "soft"
clock_style = "digital"

[widgets]
shape = "rounded"
surface = "vivid-glass"

[style_profile]
family = "animated"
density = "comfortable"
surface_mode = "vivid-glass"
motion = "playful"
panel_shadow = 0.24
outline_strength = 0.18
glass_strength = 0.12
widget_radius = 16
panel_padding = 15

[effects]
particles = "sparkles"
particle_count = 8
particle_speed = 0.55
ambient_effect = "animated-rainbow"
effect_intensity = 0.85
effect_cycle_ms = 4800
hover_reactivity = 0.75

[bar_dynamics]
drawer_style = "context-card"
module_density = "balanced"
workspace_preview = "hybrid"
rail_accent = "pulse-line"

[terminal_visual]
overlay_asset = ""
overlay_opacity = 0.0

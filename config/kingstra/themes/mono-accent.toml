[meta]
name = "Mono Accent"
description = "Mono met één wallpaperaccent - color splash, neutrale vlakken en één tintfamilie"
icon = "󰏘"
preview_image = "mono.jpg"

[matugen]
scheme_type = "scheme-fidelity"
color_index = 0
contrast = 0.58
mode = "dark"

[appearance]
border_radius = 0
border_width = 1
gaps_in = 3
gaps_out = 5
bar_opacity = 0.99
popup_opacity = 0.99
blur_size = 0
blur_passes = 0
animation_speed = 1.00

[fonts]
ui_font = "JetBrains Mono"
ui_font_size = 12
mono_font = "JetBrainsMono Nerd Font"
mono_font_size = 12
display_font = "JetBrains Mono"
font_weight = "medium"
letter_spacing = 0

[icons]
icon_theme = "Breeze"

[quickshell]
bar_height = 34
bar_position = "bottom"
bar_rail_enabled = false
bar_rail_edge = "left"
bar_rail_width = 48
bar_status_strip_enabled = true
bar_status_strip_edge = "bottom"
bar_status_strip_height = 34

[color_transform]
hue_shift = 0
saturation_adjust = 0.0
lightness_adjust = -0.04
thematic_mix = 0.0

[material]
texture = "fine-noise"
overlay_opacity = 0.02
glow_intensity = 0.0

[terminal]
bg_opacity = 0.98
blur = false
padding = 8
cursor_style = "block"

[bar]
shape = "block"
template = "horizontal"
width_mode = "full"
floating = false
attach_to_screen_edge = true
top_edge_style = "hard"
bottom_edge_style = "hard"
clock_style = "digital"
topbar_loose_blocks = false

[widgets]
shape = "hard-rect"
surface = "solid"

[style_profile]
family = "mono"
density = "compact"
surface_mode = "solid"
motion = "firm"
panel_shadow = 0.02
outline_strength = 0.42
glass_strength = 0.0
widget_radius = 0
panel_padding = 7

[effects]
particles = "none"
particle_count = 0
particle_speed = 0.0
ambient_effect = "none"
effect_intensity = 0.0
effect_cycle_ms = 0
hover_reactivity = 0.08

[bar_dynamics]
drawer_style = "none"
module_density = "minimal"
workspace_preview = "numbers"
rail_accent = "segmented"

[terminal_visual]
overlay_asset = ""
overlay_opacity = 0.0

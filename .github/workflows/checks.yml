name: Checks

on:
  push:
  pull_request:
  workflow_dispatch:

concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true

jobs:
  smoke:
    name: Smoke tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # Arch, zodat Qt (QtQuick.Effects, qmltestrunner) dezelfde versie heeft als
    # op de pc en laptop; Ubuntu 24.04 zit op Qt 6.4.
    container: archlinux:latest
    steps:
      - name: Install dependencies
        run: pacman -Syu --noconfirm --needed git lua ripgrep jq python python-pillow qt6-declarative qt6-5compat qt6-svg ttf-dejavu
      - uses: actions/checkout@v4
      - run: git config --global --add safe.directory "$GITHUB_WORKSPACE"
      - run: tests/scripts/check.sh smoke
        env:
          QT_QPA_PLATFORM: offscreen

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: tests/scripts/check.sh shellcheck
      # Warnings block too since 2026.10: the list was cleaned up, deliberate
      # exceptions carry an inline directive or live in .shellcheckrc.
      - name: Warnings
        run: tests/scripts/check.sh shellcheck-warnings

  qmllint:
    name: qmllint
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: Install qmllint
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends qt6-declarative-dev-tools
      - run: tests/scripts/check.sh qmllint
        env:
          QMLLINT: /usr/lib/qt6/bin/qmllint

  bediening-colors:
    name: Bediening render en contrast
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install Qt renderer
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends libegl1 libopengl0 fonts-dejavu-core
          python -m pip install PySide6==6.10.0
      - name: Reproduce original color collision
        run: python tests/render/bediening-colors.py --baseline
      - name: Render and check dark and light colors
        run: python tests/render/bediening-colors.py
      - name: Save rendered pages
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bediening-render
          path: artifacts/bediening-colors/*.png
          if-no-files-found: ignore

  arch-installer:
    name: Installer in schone Arch
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    container: archlinux:latest
    steps:
      - name: Basis
        run: |
          pacman -Syu --noconfirm --needed git sudo base-devel python curl pacman-contrib
          useradd -m kingstra
          echo 'kingstra ALL=(ALL) NOPASSWD: ALL' > /etc/sudoers.d/kingstra
      - uses: actions/checkout@v4
      - name: Pakketten en installer-proefdraai (pc en laptop)
        run: |
          chown -R kingstra "$GITHUB_WORKSPACE"
          sudo -u kingstra -H env HOME=/home/kingstra bash "$GITHUB_WORKSPACE/tests/ci/arch-check.sh"
      - name: Installerlogs bewaren
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: arch-installer-logs
          path: /tmp/install-*.log
          if-no-files-found: ignore

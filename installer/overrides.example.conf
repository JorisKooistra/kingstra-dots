# =============================================================================
# Voorbeeld: eigen keuzes voor de installer
# =============================================================================
# Kopieer naar ~/.config/kingstra/overrides.conf. De installer (en dus elke
# update) leest dat bestand automatisch na de hardwaredetectie. Het staat
# niet in git en blijft bij updates staan.
#
# Eenmalig een ander bestand gebruiken kan ook: ./install.sh --override <bestand>
#
# Zet alleen de regels aan die je wilt veranderen; de rest volgt de detectie.
# =============================================================================

# Achtergrond
# ENABLE_VIDEO_WALLPAPER=false     # mpvpaper voor video-achtergronden

# Hardware (normaal automatisch gedetecteerd)
# ENABLE_POWER_PROFILES=true       # power-profiles-daemon
# ENABLE_BRIGHTNESS_CONTROL=true   # brightnessctl
# TOUCHPAD_NATURAL_SCROLL=true
# ENABLE_TABLET_MODE=false         # draaien + schermtoetsenbord op convertibles
# ENABLE_FINGERPRINT=false         # fprintd + PAM

# Sessie
# ENABLE_SDDM=true                 # Kingstra-loginscherm

# Kleuren
# MATUGEN_COLOR_INDEX=0            # welke wallpaperkleur de basis is

# Optionele apps (staan nooit vanzelf aan)
# ENABLE_SPICETIFY=true
# ENABLE_VESKTOP=true
# ENABLE_OPTIONAL_OFFICE=true
# ENABLE_OPTIONAL_HEROIC=true
# ENABLE_OPTIONAL_VLC=true
